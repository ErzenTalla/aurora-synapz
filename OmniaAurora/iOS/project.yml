name: Aurora
options:
  bundleIdPrefix: com.omniaos
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"

settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1

targets:
  Aurora:
    type: application
    platform: iOS
    sources:
      - Aurora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omniaos.aurora
        INFOPLIST_FILE: Aurora/Info.plist
    info:
      path: Aurora/Info.plist
      properties:
        CFBundleName: Aurora
        CFBundleDisplayName: Aurora
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Aurora needs the microphone to let you talk through today's context instead of typing it.
        NSSpeechRecognitionUsageDescription: Aurora uses speech recognition to turn what you say into today's briefing context.
