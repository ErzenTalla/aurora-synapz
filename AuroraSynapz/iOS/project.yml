name: AuroraSyanapz
options:
  bundleIdPrefix: com.aurorasyanapz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"

settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1

targets:
  AuroraSyanapz:
    type: application
    platform: iOS
    sources:
      - AuroraSyanapz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurorasyanapz.app
        INFOPLIST_FILE: AuroraSyanapz/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: AuroraSyanapz/Info.plist
      properties:
        CFBundleName: Aurora Synapz
        CFBundleDisplayName: Aurora Synapz
        UILaunchScreen:
          UIColorName: LaunchScreenBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSFaceIDUsageDescription: Use Face ID to securely access your portfolio

  AuroraSyanapzTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AuroraSyanapzTests
    dependencies:
      - target: AuroraSyanapz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurorasyanapz.tests
        GENERATE_INFOPLIST_FILE: YES
